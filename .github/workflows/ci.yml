name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: dotnet test --project tests/Pgcheckup.Tests
        env:
          PGCHECKUP_TEST_POSTGRES: ${{ matrix.postgres }}

  native-aot:
    name: NativeAOT (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Trim and AOT warnings are errors, so this fails on any IL2xxx or IL3xxx warning.
      - name: Publish
        run: dotnet publish src/Pgcheckup -c Release -r linux-x64 -o out
      - name: Scan an inactive slot with the published binary
        run: dotnet test --project tests/Pgcheckup.Tests -- --filter-class Pgcheckup.Tests.Cli.NativeBinaryTests
        env:
          PGCHECKUP_BINARY: ${{ github.workspace }}/out/pgcheckup
